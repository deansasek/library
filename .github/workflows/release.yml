name: Release

# Pushing a tag such as v1.2.0 publishes a release. Running the workflow by hand with a version does the same and
# creates the tag. The release holds a source zip, not a built app: people build it themselves with ./install.sh.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, such as 1.2.0
        required: true

# Read only by default. The build job runs repository code, so it never gets a write token. Only the publish job
# below, which runs no repository code, gets write access.
permissions:
  contents: read

jobs:
  # Builds and tests the code with a read-only token. The checkout keeps no credentials in .git/config, so the code
  # that build.sh and test.sh run cannot reach the token either.
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Work out the version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      # Reuses SwiftPM's .build between runs. The key changes with the manifest, the lockfile, or any source file. A
      # partial match falls back to the same manifest, and swift build then compiles only what changed.
      - name: Cache the SwiftPM build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift') }}-${{ hashFiles('Package.resolved') }}-${{ hashFiles('Sources/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-${{ hashFiles('Package.swift') }}-
      # Do not publish a version that does not build or pass its checks.
      - name: Build
        run: ./build.sh
      - name: Run the checks
        run: ./test.sh
      # .gitattributes leaves out everything the app does not need to build: tests, workflows, docs, and scripts.
      - name: Zip the source
        run: git archive --format=zip --prefix="Library-$VERSION/" -o "Library-$VERSION.zip" HEAD
      # The checksum is published next to the zip, so the update in the app and the install command can check the
      # download before running any of it. The file is in the form `shasum -a 256 -c` reads.
      - name: Checksum the source
        run: shasum -a 256 "Library-$VERSION.zip" > "Library-$VERSION.zip.sha256"
      - name: Keep the source and its checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-files
          path: Library-*.zip*
          if-no-files-found: error

  # Publishes the files the build job made. It downloads them and runs no repository code, so the write token is
  # used only for the release calls.
  publish:
    needs: build
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - name: Work out the version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Download the source and its checksum
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-files
      # GitHub's API can return a 500 after it has made part of the release. Each attempt first checks for the release,
      # so a retry after a partial publish never creates a second one. Four attempts, waiting 15, 30, and 60 seconds.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v$VERSION"
          delays=(15 30 60)
          for attempt in 1 2 3 4; do
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Release $tag already exists, so there is nothing to create."
              exit 0
            fi
            if gh release create "$tag" "Library-$VERSION.zip" "Library-$VERSION.zip.sha256" --title "Library $VERSION" --generate-notes --target "$GITHUB_SHA"; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              delay=${delays[$((attempt - 1))]}
              echo "Attempt $attempt to publish $tag failed. Retrying in $delay seconds."
              sleep "$delay"
            fi
          done
          echo "Could not publish $tag after 4 attempts." >&2
          exit 1
