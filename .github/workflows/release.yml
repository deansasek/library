name: Release

# Pushing a tag such as v1.2.0 publishes a release. Running the workflow by hand with a version does the same and
# creates the tag. The release holds a source zip, not a built app: people build it themselves with ./install.sh.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, such as 1.2.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Work out the version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      # Do not publish a version that does not build or pass its checks.
      - name: Build
        run: ./build.sh
      - name: Run the checks
        run: ./test.sh
      # .gitattributes leaves out everything the app does not need to build: tests, workflows, docs, and scripts.
      - name: Zip the source
        run: git archive --format=zip --prefix="Library-$VERSION/" -o "Library-$VERSION.zip" HEAD
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" "Library-$VERSION.zip" --title "Library $VERSION" --generate-notes --target "$GITHUB_SHA"
