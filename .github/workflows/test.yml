name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      # Reuses SwiftPM's .build between runs. The key changes with the manifest, the lockfile, or any source file. A
      # partial match falls back to the same manifest, and swift build then compiles only what changed.
      - name: Cache the SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift') }}-${{ hashFiles('Package.resolved') }}-${{ hashFiles('Sources/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-${{ hashFiles('Package.swift') }}-
      - name: Build
        run: ./build.sh
      - name: Run the checks
        run: ./test.sh
      # Draws every screen in light and dark appearance and checks text contrast. Any failure stops the run. The PNGs are
      # uploaded even when a check fails, so a reviewer can look at them.
      - name: Render the screens
        run: Tests/render.sh "$RUNNER_TEMP/renders"
      - name: Upload the renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renders
          path: ${{ runner.temp }}/renders
          if-no-files-found: warn
