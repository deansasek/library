name: Test

# Pull requests run the checks; a push to main also builds the release app and renders the screens. Documentation-only
# changes skip the run, and a new push to a pull request cancels the run it replaces.
on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - ".gitattributes"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      # Reuses SwiftPM's .build between runs. The key changes with the manifest, the lockfile, or any source file. A
      # partial match falls back to the same manifest, and swift build then compiles only what changed.
      - name: Cache the SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift') }}-${{ hashFiles('Package.resolved') }}-${{ hashFiles('Sources/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-${{ hashFiles('Package.swift') }}-
      # test.sh compiles the app's sources itself, so a pull request does not need a separate release build.
      - name: Run the checks
        run: ./test.sh

  # The release build is what main ships, so it runs on main only.
  build:
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: ./build.sh

  # Draws every screen in light and dark appearance and checks text contrast. Runs on main and on demand, since it is the
  # slowest step. The PNGs are uploaded even when a check fails, so a reviewer can look at them.
  render:
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Render the screens
        run: Tests/render.sh "$RUNNER_TEMP/renders"
      - name: Upload the renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renders
          path: ${{ runner.temp }}/renders
          if-no-files-found: warn
